name: kronos

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      KRONOS_DOMAIN: ${KRONOS_DOMAIN:?set KRONOS_DOMAIN, e.g. api.kronos.example}
      KRONOS_ACME_EMAIL: ${KRONOS_ACME_EMAIL:?set KRONOS_ACME_EMAIL for Let's Encrypt expiry notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [kronos]

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "node scripts/seed.js && node src/server.js"]
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-kronos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kronos}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JOIN_TICKET_SECRET: ${JOIN_TICKET_SECRET:?set JOIN_TICKET_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PUBLIC_BASE_URL: https://${KRONOS_DOMAIN}
      KRONOS_GAMES_DIR: /games
      ENGINE_RUNTIME_PATH: /usr/local/bin/engine_runtime
      # config.jitServerHost's own default (127.0.0.1) is correct for
      # nothing except a client running on this same machine -- every
      # game_servers row it produces gets handed straight back to a real
      # remote player's own client (KronosApi::allocateServer() takes
      # `server.host` from the API response verbatim, see that function's
      # own comment), so a real player's client was trying to ENet-connect
      # to *their own* loopback address and hanging on "Connecting to
      # <game>..." forever. Real, public-reachable value required here.
      JIT_SERVER_HOST: ${KRONOS_DOMAIN}
      # Real, live-observed constraint on this exact 1 vCPU/1GB host: this
      # Docker daemon runs with the userland proxy enabled, which forks a
      # real, separate docker-proxy OS process PER PUBLISHED PORT for a UDP
      # range (not one iptables rule for the whole range) -- publishing the
      # full 30000-30999 range below tried to fork 1000 of them and the
      # container failed to come up at all ("resource temporarily
      # unavailable"), a real production outage. Narrowed to what this
      # host can actually afford; matches `ports:` below exactly.
      JIT_SERVER_PORT_RANGE_START: "30000"
      JIT_SERVER_PORT_RANGE_END: "30004"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../games:/games:ro
      - ../engine/build/src/engine_runtime:/usr/local/bin/engine_runtime:ro
    # JIT-spawned engine_runtime processes are real children of this
    # container's own node process (see sessions/provisioner.js), so their
    # ENet UDP listeners live inside this container's own network
    # namespace -- without a real port publish here, JIT_SERVER_HOST above
    # can point a client at the exact right address and it would still
    # never reach anything. Kept narrow (5 ports) to match
    # JIT_SERVER_PORT_RANGE_START/END above -- see that comment for why.
    ports:
      - "30000-30004:30000-30004/udp"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [kronos]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["node", "scripts/migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-kronos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kronos}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JOIN_TICKET_SECRET: ${JOIN_TICKET_SECRET:?set JOIN_TICKET_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kronos]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kronos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kronos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kronos} -d ${POSTGRES_DB:-kronos}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [kronos]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [kronos]

  recycle-usernames:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do node scripts/recycle-usernames.js || true; sleep 3600; done"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-kronos}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kronos}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JOIN_TICKET_SECRET: ${JOIN_TICKET_SECRET:?set JOIN_TICKET_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [kronos]

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

networks:
  kronos:
    driver: bridge
