name: Build Windows Installer

# Broader than build.yml's tag-only trigger on purpose: every push to
# main also builds KronosSetup.exe (as a downloadable artifact only) so
# the installer itself doesn't silently bit-rot between releases. Only a
# v* tag push attaches it to a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

env:
  ENGINE_DIR: engine
  BUILD_DIR: engine/build

jobs:
  build-installer:
    name: KronosSetup.exe (x64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Same real recipe as build.yml's own build-windows job: this
      # project needs the vcpkg toolchain file for SDL2/zlib/curl and a
      # separate Vulkan SDK install (windows-latest ships neither) --
      # plain `cmake -G Ninja` alone fails to configure without both.
      - name: Install Windows dependencies (vcpkg)
        run: vcpkg install sdl2:x64-windows zlib:x64-windows curl:x64-windows

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      - name: Add Vulkan SDK tools to PATH
        run: echo "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure (Release)
        run: |
          cmake -S "$env:ENGINE_DIR" -B "$env:BUILD_DIR" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$env:BUILD_DIR" --config Release --parallel

      - name: Stage install tree
        run: cmake --install "$env:BUILD_DIR" --config Release --prefix installer/dist

      # Belt-and-braces: engine/src/CMakeLists.txt's own
      # RUNTIME_DEPENDENCY_SET install rule is supposed to copy these
      # already, but that path is explicitly flagged in that file's own
      # comment as untested on a real Windows build. build.yml's own ZIP
      # packaging job hit exactly this failure mode for real once (an
      # archive with no SDL2.dll/libcurl.dll/z.dll that could not launch
      # at all) and fixed it the same way -- copy vcpkg's bin/*.dll in
      # explicitly, -Force so it's a no-op if they're already there.
      - name: Stage runtime DLLs
        run: |
          $vcpkgBin = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin"
          if (-not (Test-Path $vcpkgBin)) {
            Write-Error "vcpkg bin directory not found at $vcpkgBin"
            exit 1
          }
          Copy-Item "$vcpkgBin\*.dll" "installer\dist\" -Force

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile installer
        run: iscc installer\build_installer.iss

      - name: Upload KronosSetup.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: KronosSetup-Windows
          path: installer/output/KronosSetup.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/output/KronosSetup.exe
