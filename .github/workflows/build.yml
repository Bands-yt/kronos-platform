name: Build Kronos

# Kronos ("Release Packaging CI"): fires on any pushed version tag
# (v0.1.0-alpha, v1.2.3, ...) -- the same trigger a `git tag vX.Y.Z &&
# git push origin vX.Y.Z` already uses to cut a GitHub Release, so a
# tag push is the one real, deliberate "build and publish" signal this
# workflow needs.
on:
  push:
    tags:
      - "v*"

# Required so softprops/action-gh-release can create/update the Release
# and upload assets to it using the workflow's own GITHUB_TOKEN.
permissions:
  contents: write

env:
  # engine/ is the real CMake project root in this repo (see
  # engine/CMakeLists.txt) -- every configure/build step below runs
  # with this as -S/working-directory, not the repo root.
  ENGINE_DIR: engine
  BUILD_DIR: engine/build

jobs:
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Real build-time deps this project's CMake actually needs on
      # Linux: build-essential (gcc/g++/make) + cmake for the toolchain,
      # libvulkan-dev for the Vulkan loader/headers, libsdl2-dev + zlib +
      # libcurl + libsecret for the system find_package(... REQUIRED)/
      # pkg_check_modules(... REQUIRED) deps engine/cmake/Dependencies.cmake
      # declares, and glslc (real GLSL->SPIR-V shader compiler --
      # engine/src/CMakeLists.txt's own find_program(GLSLC_EXECUTABLE glslc
      # REQUIRED) compiles every real .vert/.frag at build time; libvulkan-dev
      # alone only provides the loader/headers, not this compiler) --
      # everything else (EnTT, glm, volk, Jolt, Luau, ENet, Dear ImGui) is
      # fetched and built from source by CMake's own FetchContent, no
      # separate install needed.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            git \
            pkg-config \
            libvulkan-dev \
            libsdl2-dev \
            zlib1g-dev \
            libcurl4-openssl-dev \
            libsecret-1-dev \
            glslc

      - name: Configure (Release)
        run: |
          cmake -S "$ENGINE_DIR" -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build "$BUILD_DIR" --config Release --parallel

      # Kronos: packages the real compiled outputs a tester actually
      # needs to run the engine -- the three built binaries plus their
      # real compiled shaders (ENGINE_SHADER_DIR's own runtime fallback
      # dir), not the whole build tree (object files/CMake cache).
      - name: Package (.tar.gz)
        run: |
          set -euo pipefail
          PKG_DIR="kronos-linux-x64"
          mkdir -p "$PKG_DIR/shaders"
          cp "$BUILD_DIR/src/engine_runtime" "$PKG_DIR/"
          cp "$BUILD_DIR/src/studio" "$PKG_DIR/"
          cp "$BUILD_DIR/tests/engine_tests" "$PKG_DIR/"
          cp "$BUILD_DIR"/shaders/*.spv "$PKG_DIR/shaders/"
          tar -czf "kronos-${{ github.ref_name }}-linux-x64.tar.gz" "$PKG_DIR"

      # Kronos ("Bootstrap Installer" -- "verify the integrity of the
      # files"): a real, published checksum -- without this, "basic
      # checksum check" on the installer side would have nothing real
      # to check against (GitHub's own Releases API doesn't publish
      # asset checksums itself).
      - name: Generate checksum
        run: sha256sum "kronos-${{ github.ref_name }}-linux-x64.tar.gz" > "kronos-${{ github.ref_name }}-linux-x64.tar.gz.sha256"

      - name: Upload archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kronos-${{ github.ref_name }}-linux-x64.tar.gz
            kronos-${{ github.ref_name }}-linux-x64.tar.gz.sha256

  build-windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # windows-latest runners ship vcpkg pre-installed
      # (%VCPKG_INSTALLATION_ROOT%) -- used here only for the real system
      # deps CMake's find_package() needs (SDL2, zlib, curl -- CredentialStore
      # on Windows uses DPAPI, a built-in Win32 API, so no libsecret
      # equivalent is needed here); every other dependency is
      # FetchContent-built from source by CMake itself, same as the
      # Linux job.
      - name: Install Windows dependencies (vcpkg)
        run: |
          vcpkg install sdl2:x64-windows zlib:x64-windows curl:x64-windows

      # windows-latest runners have no Vulkan SDK preinstalled at all --
      # unlike the Linux job's libvulkan-dev, this single install covers
      # both the real Vulkan loader/headers volk needs AND glslc.exe, the
      # real GLSL->SPIR-V shader compiler engine/src/CMakeLists.txt's own
      # find_program(GLSLC_EXECUTABLE glslc REQUIRED) requires. Its Bin/
      # directory is added to PATH so the plain "glslc" name CMake looks
      # for resolves in the Configure step right after this one.
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.3.290.0
          install_runtime: true
          cache: true

      - name: Add Vulkan SDK tools to PATH
        run: echo "$env:VULKAN_SDK\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure (Release)
        run: |
          cmake -S "$env:ENGINE_DIR" -B "$env:BUILD_DIR" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release

      # Visual Studio's generator is multi-config -- CMAKE_BUILD_TYPE
      # above is a no-op for it; --config Release is the real switch
      # that picks the Release configuration here.
      - name: Build
        run: cmake --build "$env:BUILD_DIR" --config Release --parallel

      - name: Package (.zip)
        run: |
          $pkgDir = "kronos-windows-x64"
          New-Item -ItemType Directory -Force -Path "$pkgDir\shaders" | Out-Null
          Copy-Item "$env:BUILD_DIR\src\Release\engine_runtime.exe" "$pkgDir\"
          Copy-Item "$env:BUILD_DIR\src\Release\studio.exe" "$pkgDir\"
          Copy-Item "$env:BUILD_DIR\tests\Release\engine_tests.exe" "$pkgDir\"
          Copy-Item "$env:BUILD_DIR\shaders\*.spv" "$pkgDir\shaders\"
          Compress-Archive -Path $pkgDir -DestinationPath "kronos-${{ github.ref_name }}-windows-x64.zip"

      # Kronos ("Bootstrap Installer" -- "verify the integrity of the
      # files"): same real reasoning as the Linux job's own checksum
      # step -- real, sha256sum-compatible output format (hash, two
      # spaces, filename) so both platforms' installer code can parse
      # it identically.
      - name: Generate checksum
        run: |
          $hash = (Get-FileHash "kronos-${{ github.ref_name }}-windows-x64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  kronos-${{ github.ref_name }}-windows-x64.zip" | Out-File -Encoding ascii "kronos-${{ github.ref_name }}-windows-x64.zip.sha256"

      - name: Upload archive to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            kronos-${{ github.ref_name }}-windows-x64.zip
            kronos-${{ github.ref_name }}-windows-x64.zip.sha256
